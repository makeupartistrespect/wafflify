<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAFFLIFY</title>
<style>
:root{color-scheme:light;--bg:#fff5f8;--panel:#fff;--field:#fffafd;--border:#f1dce5;--text:#342631;--muted:#927d89;--accent:#f5a9c7;--accent-hover:#ec91b5;--accent-text:#492638;--result:#b74d80;--shadow:0 8px 30px #9d557410}
body.dark{color-scheme:dark;--bg:#111214;--panel:#1b1c20;--field:#151619;--border:#303136;--text:#f3f3f5;--muted:#a0a1aa;--accent:#dedee3;--accent-hover:#c8c8d0;--accent-text:#19191d;--result:#d7d7df;--shadow:0 8px 30px #0003}
body.waffle{--bg:#edb86f;--panel:#fff2d8;--field:#fff9ec;--border:#e5bd7d;--text:#694321;--muted:#a17b4d;--accent:#f1bd5d;--accent-hover:#dfa344;--accent-text:#68401e;--result:#9b622d;--shadow:0 8px 30px #9b682018;background-color:#edb86f;background-image:repeating-linear-gradient(0deg,transparent 0 37px,#dba05a 37px 39px,#f9d69a 39px 42px),repeating-linear-gradient(90deg,transparent 0 37px,#dba05a 37px 39px,#f9d69a 39px 42px),repeating-linear-gradient(135deg,#f8cd83,#f2bd70 12px,#f9d18d 24px,#edb66b 42px);background-size:42px 42px;background-attachment:fixed}
body.nutella{--bg:#422016;--panel:#fff0d9;--field:#f8e8d0;--border:#d1a780;--text:#482719;--muted:#927057;--accent:#75402b;--accent-hover:#60301f;--accent-text:#fff4df;--result:#71351f;--shadow:0 8px 24px #1d0c071c;background:#422016}
body.icecream{--bg:#fff7e9;--panel:#fffdf7;--field:#fff9ef;--border:#f1e2cd;--text:#5c493e;--muted:#a79787;--accent:#f5d9a7;--accent-hover:#edc98b;--accent-text:#62452d;--result:#92704e;--shadow:0 8px 25px #9d795410;background-color:#fff7e9;background-image:linear-gradient(112deg,transparent 48%,#f5a6b7 49% 51%,transparent 52%),linear-gradient(68deg,transparent 48%,#8dcbb1 49% 51%,transparent 52%),linear-gradient(135deg,transparent 48%,#a9b9f4 49% 51%,transparent 52%),linear-gradient(82deg,transparent 48%,#f5cf72 49% 51%,transparent 52%),linear-gradient(120deg,transparent 48%,#c8a1e8 49% 51%,transparent 52%);background-size:97px 113px,139px 127px,163px 149px,121px 157px,181px 137px;background-attachment:fixed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;transition:background-color .2s,color .2s}button,textarea,input{font:inherit}button{cursor:pointer}
.topbar{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 6%;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:800;letter-spacing:1px}.brand-icon{display:grid;place-items:center;width:37px;height:37px;flex-shrink:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:23px;font-weight:900}
.theme-toggle{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--border);background:var(--bg);border-radius:30px}.theme-toggle button{border:0;border-radius:24px;padding:9px 12px;background:transparent;color:var(--muted);font-size:12px}.theme-toggle button.active{background:var(--accent);color:var(--accent-text);font-weight:700}
body.nutella .topbar{background:#6b402b;border:0}body.nutella .brand{color:#fff0d9}body.nutella .theme-toggle{background:#4b2a1d;border:0}body.nutella .theme-toggle button{color:#ead1b5}body.nutella .theme-toggle button.active{background:#ead1b5;color:#482719}
body.icecream .topbar{background:#fffaf0;border:0}body.icecream .brand{color:#685343}
body.waffle .topbar,body.waffle .card{background:#fff2d8f5;border-color:#e5bd7d}body.waffle .brand{color:#57351d}body.waffle .brand-icon{background:linear-gradient(145deg,#ffe6a7,#d99537);border:2px solid #b7782d;box-shadow:inset 0 2px 3px #fff5ce,0 3px 0 #9a6026}
main{width:min(820px,calc(100% - 32px));margin:42px auto}.heading{margin-bottom:25px}h1{margin:0;font-size:30px;letter-spacing:-1px}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
body.nutella #pageTitle{color:#fff0d9}body.nutella #pageSubtitle{color:#d8b99a}body.icecream #pageTitle{color:#685343}
.card{padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:18px}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:21px}.label{font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--muted)}.mode-buttons{display:flex;flex-wrap:wrap;gap:7px}
.btn{border:1px solid var(--border);border-radius:9px;padding:10px 14px;background:var(--field);color:var(--text);font-size:12px;font-weight:650;transition:background .15s,transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px)}.btn.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.btn.primary{width:100%;padding:14px;font-size:13px;margin-top:15px}
body.waffle .btn{border:1px solid #d6a04e;border-radius:10px;background:linear-gradient(180deg,#ffe7ad,#f8d17e 55%,#edb95e);color:#68401e;box-shadow:inset 0 2px 0 #fff7d9,0 3px 0 #d2a052}body.waffle .btn.active,body.waffle .btn.primary{background:linear-gradient(180deg,#f2c36b,#e4a94e);border-color:#ce9745;box-shadow:inset 0 2px 0 #ffebbd,0 3px 0 #c58d3f}
body.nutella .card{background:#fff0d9;border:0}body.nutella .btn{background:#f5e3c9;color:#482719;border:0;box-shadow:none}body.nutella .btn.active,body.nutella .btn.primary{background:#75402b;color:#fff4df}
body.icecream .card{background:#fffdf7;border-color:#f0e5d5}body.icecream .btn{background:#fff5e4;color:#735940;border-color:#eddfc9;box-shadow:none}body.icecream .btn.active,body.icecream .btn.primary{background:#f0d9ae;color:#62472e;border-color:#e8c990;box-shadow:none}
textarea{width:100%;min-height:150px;padding:15px;display:block;resize:vertical;border:1px solid var(--border);border-radius:11px;background:var(--field);color:var(--text);outline:none;font-size:14px;line-height:1.7}textarea:focus{border-color:var(--accent-hover);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}textarea::placeholder{color:var(--muted)}
.field-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;color:var(--muted);font-size:11px}.field-footer .btn{padding:8px 10px}.creativity{display:grid;grid-template-columns:auto minmax(80px,1fr) auto;align-items:center;gap:15px;margin:23px 0 0}input[type=range]{width:100%;accent-color:var(--accent-hover);cursor:pointer}.creativity-value{min-width:65px;text-align:right;font-size:12px;color:var(--result);font-weight:700}
.result-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.output{min-height:130px;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--border);border-radius:11px;background:var(--field);color:var(--result);font-size:14px;line-height:1.7}.output.placeholder{color:var(--muted)}.status{display:flex;justify-content:space-between;gap:10px;margin-top:13px;color:var(--muted);font-size:11px}
.history-card{display:none}.history-list{display:flex;flex-direction:column;gap:9px;margin-top:15px}.history-item{padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--field);cursor:pointer;overflow-wrap:anywhere}.history-item:hover{border-color:var(--accent-hover)}.history-item strong{display:block;color:var(--result);font-size:11px;margin-bottom:7px}.history-item p{margin:0 0 6px;font-size:12px}.history-item small{color:var(--muted);font-size:11px}.history-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.empty-history{color:var(--muted);font-size:13px;padding:18px 0}
.dont-click{display:block;margin:18px auto;padding:12px 22px;border:2px dashed var(--border);border-radius:12px;background:var(--panel);color:var(--text);font-weight:800;box-shadow:var(--shadow);transition:transform .2s,background .2s,color .2s}.dont-click:hover{transform:rotate(-2deg) scale(1.04)}body.waffle .dont-click{border-color:#c38a43;background:linear-gradient(180deg,#ffe7ad,#edb95e);color:#68401e;box-shadow:inset 0 2px 0 #fff7d9,0 3px 0 #a66b2c}body.nutella .dont-click{background:#75402b;color:#fff4df;border:1px dashed #bd8d67}body.icecream .dont-click{background:#f0d9ae;color:#62472e;border-color:#e8c990}
.waffle-surprise{display:none;text-align:center;margin:20px auto;animation:wafflePop .4s ease-out}.waffle-surprise img{display:block;width:220px;max-width:80%;height:auto;margin:auto;background:transparent;object-fit:contain;filter:drop-shadow(0 8px 12px #0002)}.waffle-surprise p{color:var(--result);font-size:13px;font-weight:700;margin:10px 0 0}
@keyframes wafflePop{from{opacity:0;transform:scale(.4) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@media(max-width:540px){.topbar{padding:12px 16px;min-height:68px;flex-wrap:wrap}.brand{font-size:13px}.brand-icon{width:32px;height:32px}.theme-toggle button{padding:8px 9px;font-size:11px}main{margin:26px auto}.card{padding:16px}h1{font-size:26px}.creativity{gap:9px}.field-footer{align-items:flex-start}.status{flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-icon">W</div> WAFFLIFY</div>
  <div class="theme-toggle">
    <button id="pinkTheme" type="button">♡ Pink</button>
    <button id="darkTheme" type="button">◐ Dark</button>
    <button id="waffleTheme" type="button">🧇 Waffle</button>
    <button id="nutellaTheme" type="button">🍫 Nutella</button>
    <button id="icecreamTheme" type="button">🍦 Ice Cream</button>
  </div>
</header>
<main>
  <div class="heading"><h1 id="pageTitle">wafflbafflify words</h1><p class="subtitle" id="pageSubtitle">waffilify or baffilify words :)</p></div>

    <div class="mode-row"><span class="label">TRANSFORMATION STYLE</span><div class="mode-buttons"><button class="btn active" id="waffleBtn" type="button">Wafflify</button><button class="btn" id="baffleBtn" type="button">Bafflify</button><button class="btn" id="historyBtn" type="button">History</button></div></div>
    <div class="label" style="display:block;margin-bottom:9px">INPUT</div>
    <textarea id="inputText" placeholder="Type or paste your text here..." spellcheck="false"></textarea>
    <div class="field-footer"><span id="countText">0 words · 0 characters</span><button class="btn" id="exampleBtn" type="button">Insert example</button></div>
    <div class="creativity"><span class="label">CREATIVITY</span><input type="range" id="creativity" min="0" max="100" value="45"><span class="creativity-value" id="creativityLabel">Balanced</span></div>
    <button class="btn primary" id="transformBtn" type="button">✦ &nbsp; TRANSFORM TEXT</button>
    <div style="margin-top:24px"><div class="result-header"><span class="label">RESULT</span><button class="btn" id="copyBtn" type="button">Copy result</button></div><div class="output placeholder" id="outputText">Your wafflified or bafflified text will appear here...</div></div>

const WAFFLE={"absolutely":"abso-waffilutely","perspicacious":"perspica-waffilicious","believable":"wafflievable","confusing":"waffusing","magnificent":"wafflificent","fantastic":"waffletastic","incredible":"wafflicredible","wonderful":"wafflerful","beautiful":"waffiliful","probably":"waffilably","definitely":"waffilinitely","ridiculous":"waffliculous","extraordinary":"extra-waffilinary","unbelievable":"unwafflievable","complicated":"wafflicated","interesting":"wafflistering","intelligent":"waffligent","confident":"waffident","delicious":"wafflicious","excellent":"waffcellent","amazing":"waffmazing","terrible":"waffrible","important":"waffortant","understand":"waffderstand","conversation":"waffversation","impossible":"waffpossible","unfortunate":"wafffortunate","successful":"waffcessful","beautifully":"waffilifully","friendship":"waffriendship","information":"wafformation","personality":"waffersonality","entertaining":"waffertaining","imagination":"waffagination","university":"waffiversity","communication":"wafficational","technology":"waffnology","appreciate":"waffreciate","phenomenal":"waffenomenal","obviously":"waffviously","adventure":"waffdventure","adventurous":"waffventurous","aggressive":"waffgressive","ambitious":"waffbitious","annoying":"waffoying","awesome":"waffesome","awkward":"waffkward","brilliant":"waffilliant","celebration":"wafflebration","challenge":"waffallenge","character":"waffaracter","chocolate":"waffocolate","comfortable":"waffortable","creativity":"waffreativity","curiosity":"waffuriosity","dangerous":"waffgerous","determined":"wafftermined","disastrous":"waffastrous","discovery":"waffcovery","dramatic":"wafframatic","education":"waffucation","emotional":"waffotional","energetic":"waffnergetic","enthusiasm":"waffusiasm","environment":"waffironment","especially":"waffespecial","eventually":"waffentually","experience":"wafferience","expression":"waffression","fabulous":"waffabulous","fascinating":"waffcination","fearless":"waffearless","forgetful":"wafforgetful","frustrating":"waffrustrating","generosity":"waffenerosity","gorgeous":"wafforgeous","hilarious":"waffilarious","honestly":"waffonestly","hopefully":"waffopefully","horrendous":"wafforrendous","hypothetical":"waffothetical","immediately":"waffmediately","impressive":"waffpressive","independent":"waffependent","inspiration":"waffspiration","intimidating":"waffimidating","irritating":"waffritating","legendary":"waffendary","magnificently":"wafflificently","mysterious":"waffsterious","nonsense":"waffonsense","obnoxious":"waffnoxious","opportunity":"waffportunity","outrageous":"wafftrageous","overwhelming":"waffwhelming","perfection":"wafffection","phenomenon":"waffenomenon","unbelievably":"unwafflievably"};
const BAFFLE=Object.fromEntries(Object.entries(WAFFLE).map(([word,result])=>[word,result.replaceAll("waff","baff")]));
let mode="wafflify",history=[];const $=id=>document.getElementById(id);
function preserveCase(source,result){if(source===source.toUpperCase())return result.toUpperCase();if(source[0]===source[0].toUpperCase()&&source.slice(1)===source.slice(1).toLowerCase())return result.charAt(0).toUpperCase()+result.slice(1);return result}
function splitWord(word){const endings=["ingly","ation","ition","ously","fully","able","ible","ment","ness","less","ious","eous","ally","ing","tion","sion","ely","ly","ed","er","est"];let stem=word,ending="";for(const suffix of endings){if(word.length>suffix.length+3&&word.endsWith(suffix)){stem=word.slice(0,-suffix.length);ending=suffix;break}}const vowels="aeiouy",boundaries=[];for(let i=2;i<stem.length-1;i++){if(vowels.includes(stem[i-1])!==vowels.includes(stem[i]))boundaries.push(i)}let split;if(boundaries.length){const midpoint=stem.length/2;split=boundaries.reduce((best,i)=>Math.abs(i-midpoint)<Math.abs(best-midpoint)?i:best,boundaries[0])}else split=Math.max(2,Math.floor(stem.length/2));return[stem.slice(0,split),stem.slice(split),ending]}
function blend(word,currentMode,creativity){const lower=word.toLowerCase(),dictionary=currentMode==="wafflify"?WAFFLE:BAFFLE;if(dictionary[lower])return preserveCase(word,dictionary[lower]);const prefix=currentMode==="wafflify"?"waff":"baff";if(lower.length<=3)return preserveCase(word,lower+prefix);const[left,right,ending]=splitWord(lower);let inserts=currentMode==="wafflify"?["waff","waffil","waffle","wafflic"]:["baff","baffil","baffle","bafflic"];if(creativity<35)inserts=inserts.slice(0,2);else if(creativity>75)inserts.push(currentMode==="wafflify"?"waffilicious":"bafflicious");let candidates=inserts.map(insert=>left+insert+right+ending);candidates.push(inserts[0]+lower,left+inserts[0]+ending);candidates=candidates.map(candidate=>candidate.replace(/([a-z])\1{2,}/g,"$1$1")).filter(candidate=>candidate!==lower);return preserveCase(word,candidates[Math.floor(Math.random()*candidates.length)])}
function transformText(text,currentMode,creativity){return text.replace(/[A-Za-z]+(?:'[A-Za-z]+)?/g,token=>{const match=token.match(/^([A-Za-z]+)('[A-Za-z]+)?$/);if(!match)return token;const[,base,apostrophe]=match;return blend(base,currentMode,creativity)+(apostrophe||"")})}
function updateCount(){const text=$("inputText").value,words=text.match(/\b[\w']+\b/g)||[];$("countText").textContent=`${words.length} words · ${text.length} characters`}
function setMode(nextMode){mode=nextMode;$("waffleBtn").classList.toggle("active",mode==="wafflify");$("baffleBtn").classList.toggle("active",mode==="bafflify")}
function generate(){const original=$("inputText").value;if(!original.trim()){$("statusText").textContent="Enter some text first.";return}const result=transformText(original,mode,Number($("creativity").value));$("outputText").textContent=result;$("outputText").classList.remove("placeholder");$("statusText").textContent="Transformation complete.";history.unshift({original,result,mode});history=history.slice(0,50)}
function updateCreativity(){const value=Number($("creativity").value);$("creativityLabel").textContent=value<30?"Subtle":value<70?"Balanced":"Chaotic"}
function example(){$("inputText").value="absolutely magnificent and unbelievably confusing";updateCount();generate()}
async function copyResult(){const output=$("outputText");if(output.classList.contains("placeholder")||!output.textContent.trim()){$("statusText").textContent="Nothing to copy.";return}try{await navigator.clipboard.writeText(output.textContent);$("statusText").textContent="Copied to clipboard."}catch{const temporary=document.createElement("textarea");temporary.value=output.textContent;document.body.appendChild(temporary);temporary.select();const copied=document.execCommand("copy");temporary.remove();$("statusText").textContent=copied?"Copied to clipboard.":"Clipboard access was blocked."}}
function showHistory(){$("studioView").style.display="none";$("historyView").style.display="block";$("pageTitle").textContent="History";$("pageSubtitle").textContent="Your recent transformations.";const list=$("historyList");list.replaceChildren();if(!history.length){const empty=document.createElement("div");empty.className="empty-history";empty.textContent="No transformations yet.";list.appendChild(empty);return}history.forEach(item=>{const entry=document.createElement("div");entry.className="history-item";const heading=document.createElement("strong");heading.textContent=item.mode.toUpperCase();const original=document.createElement("p");original.textContent=item.original;const result=document.createElement("small");result.textContent="Result: "+item.result;entry.append(heading,original,result);entry.addEventListener("click",()=>{$("inputText").value=item.original;$("outputText").textContent=item.result;$("outputText").classList.remove("placeholder");setMode(item.mode);updateCount();showStudio();$("statusText").textContent="Loaded from history."});list.appendChild(entry)})}
function showStudio(){$("studioView").style.display="block";$("historyView").style.display="none";$("pageTitle").textContent="wafflbafflify words";$("pageSubtitle").textContent="waffilify or baffilify words :)"}
function setTheme(theme){document.body.classList.remove("dark","waffle","nutella","icecream");if(theme!=="pink")document.body.classList.add(theme);for(const name of ["pink","dark","waffle","nutella","icecream"])$(name+"Theme").classList.toggle("active",name===theme);try{localStorage.setItem("wafflify-theme",theme)}catch{}}
$("inputText").addEventListener("input",updateCount);$("inputText").addEventListener("keydown",event=>{if(event.ctrlKey&&event.key==="Enter"){event.preventDefault();generate()}});
$("waffleBtn").addEventListener("click",()=>setMode("wafflify"));$("baffleBtn").addEventListener("click",()=>setMode("bafflify"));$("transformBtn").addEventListener("click",generate);$("exampleBtn").addEventListener("click",example);$("copyBtn").addEventListener("click",copyResult);$("creativity").addEventListener("input",updateCreativity);
$("pinkTheme").addEventListener("click",()=>setTheme("pink"));$("darkTheme").addEventListener("click",()=>setTheme("dark"));$("waffleTheme").addEventListener("click",()=>setTheme("waffle"));$("nutellaTheme").addEventListener("click",()=>setTheme("nutella"));$("icecreamTheme").addEventListener("click",()=>setTheme("icecream"));
$("historyBtn").addEventListener("click",showHistory);$("backBtn").addEventListener("click",showStudio);$("clearHistoryBtn").addEventListener("click",()=>{history=[];showHistory()});
$("dontClickBtn").addEventListener("click",()=>{const surprise=$("waffleSurprise"),button=$("dontClickBtn");surprise.style.display="block";button.textContent="YOU WERE WARNED";button.disabled=true;surprise.scrollIntoView({behavior:"smooth",block:"center"})});
let savedTheme="pink";try{const stored=localStorage.getItem("wafflify-theme");if(["pink","dark","waffle","nutella","icecream"].includes(stored))savedTheme=stored}catch{}setTheme(savedTheme);updateCount();updateCreativity();
</script>
